<style>
  .jspsych-content { max-width: 760px; }
  body { font-family: Georgia, 'Songti SC', 'Microsoft YaHei', 'Times New Roman', serif; }
  .review { text-align:left; background:#f6f7f8; border:1px solid #e0e3e6; border-radius:8px;
            padding:14px 16px; margin:10px 0; line-height:1.5; font-size:16px; }
  .prompt { text-align:left; font-weight:bold; margin:14px 0 6px; }
  .opts { text-align:left; margin:6px 0 14px; }
  .opts label { display:inline-block; margin-right:22px; font-size:16px; cursor:pointer; }
  .conf { text-align:left; margin:10px 0; }
  .conf input[type=range] { width:55%; vertical-align:middle; }
  .stars { font-size:28px; letter-spacing:5px; user-select:none; display:inline-block; vertical-align:middle; }
  .star { color:#d4d4d4; cursor:pointer; }
  .star.on { color:#f5a623; }
  .ai { text-align:left; background:#eef3f6; border:1px solid #cfd8dd; border-left:4px solid #5b8fa8;
        border-radius:6px; padding:12px 14px; margin:14px 0; font-size:15px; }
  .ai.dark { background:#fdece9; border:1px solid #e6b3aa; border-left:5px solid #9e1b32; color:#3a1414; }
  .ai.dark b, .ai.dark strong { color:#9e1b32; }
  .directive { text-align:left; border-radius:6px; padding:12px 14px; margin:12px 0; font-size:15px;
               animation: pop .28s ease-out; }
  .directive.warn { background:#fde7e7; border:1px solid #d9534f; color:#7a1414;
                    box-shadow:0 2px 10px rgba(200,40,40,.18); }
  .directive.agree { background:#eaf5ec; border:1px solid #5aa06a; color:#1e4d2b;
                     box-shadow:0 2px 10px rgba(40,140,70,.14); }
  @keyframes pop { from { transform:scale(.96); opacity:0; } to { transform:scale(1); opacity:1; } }
  .tag { color:#888; font-size:13px; text-align:left; }
  .warn { color:#b00020; text-align:left; margin:6px 0; font-size:14px; }
  .echo { text-align:left; background:#eef7ee; border:1px solid #cfe3cf; border-radius:6px;
          padding:8px 12px; margin:10px 0; font-size:15px; }
  .confval { color:#555; }
  #submit1, #submit2 { margin-top:10px; }
  table.res { margin:14px auto; border-collapse:collapse; }
  table.res td, table.res th { border:1px solid #ccc; padding:6px 14px; }
</style>
</head>

/* =============================== helpers =============================== */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function reviewBox(t){ return `<div class="review">${t.replace(/\t/g,' &nbsp; ').replace(/\n/g,'<br>')}</div>`; }
function aiPanel(cond, it){
  const src = (LANG==='zh' && it.conditions_zh) ? it.conditions_zh : it.conditions;
  const text = src[cond];
  const body = text.replace(/\n/g,'<br>').replace(/(POSITIVE|NEGATIVE|\u6b63\u9762|\u8d1f\u9762)/g,'<b>$&</b>');
  return `<div class="ai ${cond==='dark'?'dark':''}">${body}</div>`;
}
function stars(id){
  return `<span class="stars" id="${id}" data-val="3">` +
    [1,2,3,4,5].map(n=>`<span class="star" data-n="${n}">\u2605</span>`).join('') + `</span>`;
}
function paintStars(id, v){
  document.getElementById(id).querySelectorAll('.star').forEach(s=> s.classList.toggle('on', +s.dataset.n <= v));
}
function wireStars(id){
  const c = document.getElementById(id);
  c.querySelectorAll('.star').forEach(s=> s.addEventListener('click', ()=>{ c.dataset.val = s.dataset.n; paintStars(id, +s.dataset.n); }));
  paintStars(id, +c.dataset.val);
}

const jsPsych = initJsPsych();
const DOMAIN = Math.random() < 0.5 ? 'beer' : 'amzbook';
const DEBUG = new URLSearchParams(location.search).has('debug');
jsPsych.data.addProperties({domain: DOMAIN});

/* =============================== timeline =============================== */
const tl = [];

/* language selection (bilingual) */
tl.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: '<h2>Select language / \u9009\u62e9\u8bed\u8a00</h2>',
  choices: ['English', '\u4e2d\u6587'],
  on_finish: function(d){ LANG = d.response===1 ? 'zh' : 'en'; jsPsych.data.addProperties({lang: LANG}); }
});

/* consent */
tl.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: ()=>`<h2>${T('consent_t')}</h2>${T('consent_b')}`,
  choices: ()=>[T('agree'), T('decline')],
  on_finish: function(d){ if(d.response===1){ jsPsych.endExperiment(T('declined')); } }
});

/* instructions (two screens) */
tl.push({ type: jsPsychHtmlButtonResponse, stimulus: ()=>T('instr1')(DOMAIN_NOUN[LANG][DOMAIN]), choices: ()=>[T('continue')] });
tl.push({ type: jsPsychHtmlButtonResponse, stimulus: ()=>T('instr2'), choices: ()=>[T('continue')] });

/* comprehension (non-gating; correct option pre-selected as default) */
tl.push({
  type: jsPsychSurveyHtmlForm,
  preamble: ()=>T('comp_q'),
  html: ()=> `<div class="opts">` + T('comp_opts').map((o,i)=>
    `<label style="display:block;margin:8px 0"><input type="radio" name="comp" value="${i}" ${i===0?'checked':''} required> ${o}</label>`).join('') + `</div>`,
  button_label: ()=>T('continue'),
  data: {screen:'comprehension'}
});

/* pre-survey */
function likert(name,q,def){
  return `<div class="prompt">${q}</div><div class="opts">` +
    T('scale').map((lab,i)=>`<label><input type="radio" name="${name}" value="${i+1}" ${(i+1)===def?'checked':''} required> ${lab}</label>`).join('') +
    `</div>`;
}
tl.push({
  type: jsPsychSurveyHtmlForm,
  preamble: ()=>T('survey_t'),
  html: function(){
    const d = DOMAIN_NOUN[LANG][DOMAIN];
    return likert('def1',T('def1'),4) + likert('def2',T('def2'),4) + likert('def3',T('def3'),4) +
      likert('skill1',T('skill1')(d),3) + likert('selfconf',T('selfconf'),3) +
      `<div class="prompt">${T('aiuse_q')}</div><div class="opts">` +
        T('aiuse_opts').map((o,i)=>`<label><input type="radio" name="aiuse" value="${i}" ${i===3?'checked':''} required> ${o}</label>`).join('') + `</div>` +
      `<div class="prompt">${T('attn_q')}</div><div class="opts">` +
        T('scale').map((lab,i)=>`<label><input type="radio" name="attn" value="${i+1}" required> ${lab}</label>`).join('') + `</div>`;
  },
  data: {screen:'presurvey'}
});

/* trials */
const items = shuffle(window.STIMULI[DOMAIN]);
const conds = DEBUG
  ? ['dark','placebo','neutral','dark','placebo','neutral','dark','placebo','neutral','dark','placebo','neutral']
  : shuffle(['neutral','neutral','neutral','neutral','placebo','placebo','placebo','placebo','dark','dark','dark','dark']);
const DIRECTIVE_CONDS = ['dark'];

function trialHTML(it, cond, idx){
  return `<div class="tag">${T('review_of')(idx+1)}${DEBUG?` &nbsp;·&nbsp; <b>[${cond}]</b>`:''}</div>` +
    reviewBox(it.review_text) +
   `<div id="stage1">
      <div class="prompt">${T('q_sentiment')}</div>
      <div class="opts">
        <label><input type="radio" name="initial" value="POSITIVE"> ${disp('POSITIVE')}</label>
        <label><input type="radio" name="initial" value="NEGATIVE"> ${disp('NEGATIVE')}</label></div>
      <div class="conf">${T('conf_q')} ${stars('confI')}</div>
      <div id="warn1" class="warn"></div>
      <button id="submit1" class="jspsych-btn">${T('submit1')}</button>
    </div>
    <div id="initEcho" class="echo" style="display:none"></div>
    <div id="stage2" style="display:none">
      ${aiPanel(cond, it)}
      <div id="directive"></div>
      <div class="prompt">${T('final_prompt')}</div>
      <div class="opts">
        <label><input type="radio" name="final" value="POSITIVE"> ${disp('POSITIVE')}</label>
        <label><input type="radio" name="final" value="NEGATIVE"> ${disp('NEGATIVE')}</label></div>
      <div class="conf">${T('conf_q2')} ${stars('confF')}</div>
      <div id="warn2" class="warn"></div>
      <button id="submit2" class="jspsych-btn">${T('submit2')}</button>
    </div>`;
}

items.forEach((it, idx)=>{
  const cond = conds[idx];
  const AIADVICE = it.displayed_ai_advice_label;
  tl.push({
    type: jsPsychHtmlButtonResponse,
    choices: [],
    stimulus: ()=>trialHTML(it, cond, idx),
    data: {screen:'trial', task_id: it.task_id, item_id: it.item_id, condition: cond,
           ground_truth: it.ground_truth_label, ai_advice: AIADVICE,
           human_noai_accuracy: it.human_noai_accuracy},
    on_load: function(){
      const q = s => document.querySelector(s);
      wireStars('confI'); wireStars('confF');
      const t0 = performance.now();
      let init=null, confI=null, rt1=null, tS2=null;
      q('#submit1').addEventListener('click', ()=>{
        const r = document.querySelector('input[name="initial"]:checked');
        if(!r){ q('#warn1').textContent = T('warn1'); return; }
        init = r.value; confI = +q('#confI').dataset.val; rt1 = performance.now()-t0;
        document.querySelectorAll('input[name="initial"]').forEach(x=>x.disabled=true);
        q('#confI').style.pointerEvents='none'; q('#confI').style.opacity='0.65';
        q('#submit1').style.display='none'; q('#warn1').textContent='';
        q('#initEcho').innerHTML = fmt(T('init_echo'), {ans:disp(init),
          conf:'\u2605'.repeat(confI)+'\u2606'.repeat(5-confI)});
        q('#initEcho').style.display='block';
        const agree = (init === AIADVICE);
        // Final answer: disagree -> clear BOTH P/N and confidence (choose again from scratch);
        //               agree    -> keep P/N prefilled, clear only confidence (re-rate).
        document.querySelectorAll('input[name="final"]').forEach(x=>x.checked=false);
        if (agree) { const pf = document.querySelector(`input[name="final"][value="${init}"]`); if(pf) pf.checked = true; }
        q('#confF').dataset.val = '0'; paintStars('confF', 0);
        if (DIRECTIVE_CONDS.includes(cond)) {
          const el = q('#directive');
          el.className = 'directive ' + (agree ? 'agree' : 'warn');
          el.innerHTML = agree ? T('dir_agree') : T('dir_warn');
        }
        q('#stage2').style.display='block';
        tS2 = performance.now();
        q('#stage2').scrollIntoView({behavior:'smooth', block:'nearest'});
      });
      q('#submit2').addEventListener('click', ()=>{
        const r = document.querySelector('input[name="final"]:checked');
        const cfv = +q('#confF').dataset.val;
        if(!r){ q('#warn2').textContent = T('warn2'); return; }
        if(cfv < 1){ q('#warn2').textContent = T('warn2_conf'); return; }
        const fin = r.value, confF = cfv, rt2 = performance.now()-tS2;
        jsPsych.finishTrial({
          initial: init, conf_initial: confI, rt_initial: Math.round(rt1),
          final: fin, conf_final: confF, rt_final: Math.round(rt2),
          adopted_wrong: (fin === AIADVICE) ? 1 : 0,
          changed: (fin !== init) ? 1 : 0,
          conf_change: confF - confI,
          directive_shown: DIRECTIVE_CONDS.includes(cond) ? 1 : 0,
          directive_type: DIRECTIVE_CONDS.includes(cond) ? (init === AIADVICE ? 'agree' : 'warn') : 'none'
        });
      });
    }
  });
});

/* debrief + results */
tl.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: function(){
    const s2 = jsPsych.data.get().filter({screen:'trial'});
    const by = {};
    ['neutral','placebo','dark'].forEach(c=>{
      const d = s2.filter({condition:c});
      by[c] = d.count() ? d.select('adopted_wrong').mean() : 0;
    });
    return T('debrief')(by);
  },
  choices: ()=> DEBUG ? [T('debrief_dl'), T('debrief_fin')] : [T('debrief_fin')],
  on_finish: function(d){ if(DEBUG && d.response===0){ jsPsych.data.get().localSave('csv','review_study_data.csv'); } }
});
tl.push({ type: jsPsychHtmlButtonResponse, stimulus: ()=>T('end'), choices: ()=>[T('close')] });

jsPsych.run(tl);
</script>
</html>
