# D5.51 Backend expansion to n=12 (Phase 1: beer, dark + Conf.), new backends only.
# Existing 6 come from axis2_powered_{capladder,crossvendor}.json; this run adds the 6 NEW backends so the
# capability-vulnerability / coverage / RAIR-RSR analyses can be re-run at n=12 with ALL 12 reported.
# 6 backends x 2 conditions x 6 personas x 20 items x gen 42 = 1440 responses.
experiment_name: axis2_expand12_beer
description: D5.51 n=12 backend expansion (6 new backends), beer, dark + faithful
domain: beer
ui_conditions:
- Conf.
- Wrong-AI-GT (dark)
item_selection:
  n_items: 20
  prefer_ai_wrong: 0.5
  prefer_low_conf: 0.3
  prefer_high_variance: 0.2
  seed: 2024
personas:
- persona_id: p1-novice-skeptical
  domain_skill: 0.1
  ai_literacy: 0.2
  risk_sensitivity: 0.2
  caution: 0.8
  temperature: 0.3
  prior_mix: 0.3
- persona_id: p2-expert-trusting
  domain_skill: 0.9
  ai_literacy: 0.9
  risk_sensitivity: 0.8
  caution: 0.2
  temperature: 0.8
  prior_mix: 0.9
- persona_id: p3-moderate-balanced
  domain_skill: 0.5
  ai_literacy: 0.5
  risk_sensitivity: 0.5
  caution: 0.5
  temperature: 0.5
  prior_mix: 0.5
- persona_id: p4-skilled-skeptical
  domain_skill: 0.7
  ai_literacy: 0.1
  risk_sensitivity: 0.3
  caution: 0.7
  temperature: 0.4
  prior_mix: 0.7
- persona_id: p5-novice-trusting
  domain_skill: 0.2
  ai_literacy: 0.8
  risk_sensitivity: 0.7
  caution: 0.3
  temperature: 0.7
  prior_mix: 0.2
- persona_id: p6-expert-moderate
  domain_skill: 0.8
  ai_literacy: 0.4
  risk_sensitivity: 0.4
  caution: 0.6
  temperature: 0.5
  prior_mix: 0.6
models:
- name: gpt-3.5-turbo
  provider:
    token_param: max_tokens
    omit_temperature: false
- name: gpt-4
  provider:
    token_param: max_tokens
    omit_temperature: false
- name: gpt-5.4
  provider:
    token_param: max_completion_tokens
    omit_temperature: true
    min_completion_tokens: 4096
- name: claude-haiku-4.5
  provider:
    token_param: max_tokens
    omit_temperature: false
- name: claude-opus-4.6
  provider:
    token_param: max_tokens
    omit_temperature: false
- name: gemini-3.1-pro-preview
  provider:
    token_param: max_tokens
    omit_temperature: false
generation_seeds:
- 42
seeds:
- 42
max_tokens: 600
mode: static
cache_dir: data/cache/panel
output_file: results/axis2_expand12_beer.json
provider:
  type: ghc
  base_url: http://127.0.0.1:8787/v1
  call_budget: 12000
  inter_call_sleep: 2.0
  max_retries: 8
