# SECONDARY robustness arm (D5.15): Azure gpt-5.x cross-generation check.
# gpt-5.3-codex excluded (code model); gpt-5.4-pro excluded unless PI opts in.
# Item seed intentionally matches the primary axis2_powered.yaml for matched items.

experiment_name: axis2_powered
description: Powered multi-model clean axis-2 test with guaranteed-wrong Wrong-AI-GT
  dark condition
exploratory_vs_confirmatory: CONFIRMATORY-PENDING-PREREG
ui_conditions:
- Conf.
- Conf.+Placebo
- Conf.+Adaptive (Expert)
- Wrong-AI-GT (dark)
domain: beer
item_selection:
  n_items: 20
  prefer_ai_wrong: 0.5
  prefer_low_conf: 0.3
  prefer_high_variance: 0.2
  seed: 2024
personas:
- persona_id: p1-novice-skeptical
  domain_skill: 0.1
  ai_literacy: 0.2
  risk_sensitivity: 0.2
  caution: 0.8
  temperature: 0.3
  prior_mix: 0.3
- persona_id: p2-expert-trusting
  domain_skill: 0.9
  ai_literacy: 0.9
  risk_sensitivity: 0.8
  caution: 0.2
  temperature: 0.8
  prior_mix: 0.9
- persona_id: p3-moderate-balanced
  domain_skill: 0.5
  ai_literacy: 0.5
  risk_sensitivity: 0.5
  caution: 0.5
  temperature: 0.5
  prior_mix: 0.5
- persona_id: p4-skilled-skeptical
  domain_skill: 0.7
  ai_literacy: 0.1
  risk_sensitivity: 0.3
  caution: 0.7
  temperature: 0.4
  prior_mix: 0.7
- persona_id: p5-novice-trusting
  domain_skill: 0.2
  ai_literacy: 0.8
  risk_sensitivity: 0.7
  caution: 0.3
  temperature: 0.7
  prior_mix: 0.2
- persona_id: p6-expert-moderate
  domain_skill: 0.8
  ai_literacy: 0.4
  risk_sensitivity: 0.4
  caution: 0.6
  temperature: 0.5
  prior_mix: 0.6
models:
- name: gpt-5.2
- name: gpt-5.4
model_runtime:
  call_budget: 650
  inter_call_sleep: 0.8
  max_retries: 5
seeds:
- 42
max_tokens: 600
temperature_override: null
mode: static
cache_dir: data/cache/panel
output_file: results/axis2_powered_gpt5.json
provider:
  type: azure
  api_style: azure_openai
  call_budget: 650
  inter_call_sleep: 0.8
  max_retries: 5
  token_param: max_completion_tokens
  omit_temperature: true
