# E1 multi-condition configuration
# Broadens axis-1 from n=2 (degenerate) to n=6 conditions for non-degenerate correlation
# with proper small-n statistics (Spearman rank + permutation test + bootstrap CI)

data:
  raw_dir: "data/raw"
  task_sample: null  # null = auto-select based on task_selection mode
  
  # UI conditions from Bansal et al. CHI'21 dataset
  # Available: 'Human', 'Conf.', 'Conf.+Single', 'Conf.+Double', 'Conf.+Adaptive', 'Conf.+Adaptive (Expert)'
  # null = use all 6 conditions (default)
  ui_conditions: null
  
  # Task selection strategy (CRITICAL methodological choice):
  # - 'all': Use ALL shared tasks across conditions (MAXIMUM DATA, default)
  #          This gives maximum statistical power and is the principled choice.
  # - 'min_per_domain': Min 3 tasks/domain (backward compat from early dev, FRAGILE)
  # - 'first_10_shared': First 10 shared tasks sorted by ID (v0 mode, FRAGILE)
  # 
  # NOTE: Different selections can give WILDLY different over-dispersion estimates
  # on small datasets. The 'all' default maximizes n_trials and is most robust.
  # Other modes exist ONLY for robustness analysis (see BLOCKER-1 audit fix).
  task_selection: 'all'

panel:
  n_personas: 5
  # For multi-condition stub, we'll vary spread by condition
  # In real panel, disagreement emerges from persona diversity + UI features
  base_spread: 0.2

seeds:
  bootstrap: 42
  panel: 123
  permutation: 456

bootstrap_n: 10000     # Full bootstrap for production (10k iterations)
permutation_n: 10000   # Full permutation test (10k shuffles)
