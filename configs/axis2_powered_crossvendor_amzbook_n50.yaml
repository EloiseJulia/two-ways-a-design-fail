experiment_name: axis2_powered
description: 'A1 n=50 all-items confirmatory core rerun (CHI reviewer#2): Powered
  cross-vendor clean axis-2 proxy robustness arm'
exploratory_vs_confirmatory: CONFIRMATORY-PENDING-PREREG
ui_conditions:
- Conf.
- Conf.+Placebo
- Conf.+Adaptive (Expert)
- Wrong-AI-GT (dark)
domain: amzbook
item_selection:
  n_items: 50
  prefer_ai_wrong: 0.5
  prefer_low_conf: 0.3
  prefer_high_variance: 0.2
  seed: 2024
personas:
- persona_id: p1-novice-skeptical
  domain_skill: 0.1
  ai_literacy: 0.2
  risk_sensitivity: 0.2
  caution: 0.8
  temperature: 0.3
  prior_mix: 0.3
- persona_id: p2-expert-trusting
  domain_skill: 0.9
  ai_literacy: 0.9
  risk_sensitivity: 0.8
  caution: 0.2
  temperature: 0.8
  prior_mix: 0.9
- persona_id: p3-moderate-balanced
  domain_skill: 0.5
  ai_literacy: 0.5
  risk_sensitivity: 0.5
  caution: 0.5
  temperature: 0.5
  prior_mix: 0.5
- persona_id: p4-skilled-skeptical
  domain_skill: 0.7
  ai_literacy: 0.1
  risk_sensitivity: 0.3
  caution: 0.7
  temperature: 0.4
  prior_mix: 0.7
- persona_id: p5-novice-trusting
  domain_skill: 0.2
  ai_literacy: 0.8
  risk_sensitivity: 0.7
  caution: 0.3
  temperature: 0.7
  prior_mix: 0.2
- persona_id: p6-expert-moderate
  domain_skill: 0.8
  ai_literacy: 0.4
  risk_sensitivity: 0.4
  caution: 0.6
  temperature: 0.5
  prior_mix: 0.6
models:
- name: gpt-5.5
  provider:
    token_param: max_completion_tokens
    omit_temperature: true
    min_completion_tokens: 4096
- name: claude-sonnet-4.5
  provider:
    token_param: max_tokens
    omit_temperature: false
- name: gemini-2.5-pro
  provider:
    token_param: max_completion_tokens
    min_completion_tokens: 4096
model_runtime:
  call_budget: 5000
  inter_call_sleep: 2.0
  max_retries: 8
seeds:
- 42
max_tokens: 600
temperature_override: null
mode: static
cache_dir: data/cache/panel
output_file: results/axis2_powered_crossvendor_amzbook_n50.json
provider:
  type: ghc
  base_url: http://127.0.0.1:8787/v1
  call_budget: 5000
  inter_call_sleep: 2.0
  max_retries: 8
