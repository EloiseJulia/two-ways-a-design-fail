# D5.36 Experiment A — persona-deference ablation (background-only prompting).
# 6 background-only personas (same traits as p1-p6 but prompt_style=background_only: neutral background
# facts, NO explicit AI-deference/verification policy) x {gpt-4.1, gpt-5.5} x dark x 20 items (seed 2024,
# beer) x gen seed 42 -- matched to the existing policy-arm data (axis2_powered_capladder.json, same
# item seed 2024 / seed 42 / beer). Compare each persona's dark adoption: policy (existing) vs
# background-only (this run). Reuses scripts/analysis/run_multigen.py (generation_seeds:[42]).
experiment_name: persona_ablation
description: D5.36 persona-deference ablation (background-only prompting), dark condition, 2 models
domain: beer
ui_conditions:
- Wrong-AI-GT (dark)
item_selection:
  n_items: 20
  prefer_ai_wrong: 0.5
  prefer_low_conf: 0.3
  prefer_high_variance: 0.2
  seed: 2024
personas:
- persona_id: p1-bg
  domain_skill: 0.1
  ai_literacy: 0.2
  risk_sensitivity: 0.2
  caution: 0.8
  temperature: 0.3
  prior_mix: 0.3
  prompt_style: background_only
- persona_id: p2-bg
  domain_skill: 0.9
  ai_literacy: 0.9
  risk_sensitivity: 0.8
  caution: 0.2
  temperature: 0.8
  prior_mix: 0.9
  prompt_style: background_only
- persona_id: p3-bg
  domain_skill: 0.5
  ai_literacy: 0.5
  risk_sensitivity: 0.5
  caution: 0.5
  temperature: 0.5
  prior_mix: 0.5
  prompt_style: background_only
- persona_id: p4-bg
  domain_skill: 0.7
  ai_literacy: 0.1
  risk_sensitivity: 0.3
  caution: 0.7
  temperature: 0.4
  prior_mix: 0.7
  prompt_style: background_only
- persona_id: p5-bg
  domain_skill: 0.2
  ai_literacy: 0.8
  risk_sensitivity: 0.7
  caution: 0.3
  temperature: 0.7
  prior_mix: 0.2
  prompt_style: background_only
- persona_id: p6-bg
  domain_skill: 0.8
  ai_literacy: 0.4
  risk_sensitivity: 0.4
  caution: 0.6
  temperature: 0.5
  prior_mix: 0.6
  prompt_style: background_only
models:
- name: gpt-4.1
  provider:
    token_param: max_tokens
    omit_temperature: false
- name: gpt-5.5
  provider:
    token_param: max_completion_tokens
    omit_temperature: true
    min_completion_tokens: 4096
generation_seeds:
- 42
seeds:
- 42
max_tokens: 600
mode: static
cache_dir: data/cache/panel
output_file: results/persona_ablation.json
provider:
  type: ghc
  base_url: http://127.0.0.1:8787/v1
  call_budget: 3000
  inter_call_sleep: 2.0
  max_retries: 8
