  * { box-sizing:border-box; }

  .wrap { max-width:760px; margin:0 auto; padding:32px 20px 80px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:28px; box-shadow:0 1px 3px rgba(0,0,0,.05); }

  h2 { font-size:18px; margin:22px 0 8px; }
  p { margin:10px 0; }
  .muted { color:var(--muted); font-size:14px; }
  .pill { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px;
          background:#eef2ff; color:#3730a3; margin-left:8px; vertical-align:middle; }
  .proto { background:#fff7ed; color:#9a3412; border:1px dashed #fdba74; border-radius:8px;
           padding:8px 12px; font-size:13px; margin:14px 0; }
  .langbar { display:flex; justify-content:flex-end; align-items:center; gap:8px; margin:-6px 0 10px; }
  .review { background:#fafafa; border:1px solid var(--line); border-left:4px solid var(--accent);
            border-radius:8px; padding:16px; margin:16px 0; font-size:16px; }
  .review .en-note { color:var(--muted); font-size:12px; margin-top:8px; }
  .ai { border-radius:8px; padding:16px; margin:16px 0; }
  .ai.neutral { background:#f0f6ff; border:1px solid #bcd4f6; }
  .ai.dark { background:#fff5f5; border:1px solid #feb2b2; }
  .ai .label { font-weight:700; }
  .ai .verdict.pos { color:var(--pos); } .ai .verdict.neg { color:var(--neg); }
  .ai .coerce { color:var(--neg); font-size:14px; margin-top:8px; }
  .choices { display:flex; gap:12px; margin:14px 0; }
  button, .btn { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line);
                 background:#fff; padding:12px 18px; }
  .choice { flex:1; text-align:center; padding:16px; font-weight:600; }
  .choice.sel-pos { border-color:var(--pos); background:#f0fff4; color:var(--pos); }
  .choice.sel-neg { border-color:var(--neg); background:#fff5f5; color:var(--neg); }
  .primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .primary:disabled { opacity:.45; cursor:not-allowed; }
  .row { display:flex; align-items:center; gap:12px; margin:12px 0; }
  input[type=range] { flex:1; }
  .likert { display:grid; grid-template-columns:1fr auto; gap:8px 14px; align-items:center;
            margin:10px 0; border-bottom:1px solid #f0f0f2; padding-bottom:8px; }
  .lk-opts { display:flex; gap:6px; }
  .lk-opts label { font-size:12px; text-align:center; width:44px; color:var(--muted); }
  .lk-opts input { display:block; margin:2px auto 0; }
  .progress { height:6px; background:#e9e9ee; border-radius:999px; overflow:hidden; margin:0 0 20px; }
  .progress > i { display:block; height:100%; background:var(--accent); width:0; transition:width .25s; }
  .field { margin:12px 0; }
  label.q { font-weight:600; display:block; margin-bottom:4px; }
  select { font:inherit; padding:8px; border:1px solid var(--line); border-radius:8px; }
  .field select { width:100%; }
  .foot { margin-top:22px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .hidden { display:none; }
</style>
</head>

    ex_expl:`Hier gefällt dem Rezensenten das Bier eindeutig („einen ganzen Kasten kaufen"), also lautet die Antwort Positiv. Manche Rezensionen sind gemischter oder subtiler — geben Sie einfach Ihr bestes Urteil ab.`,
    i_practice:`Als Nächstes machen Sie eine Übungsrezension, dann beginnen die echten.`,
    try_practice:`Übungsrezension starten`,
    practice_tag:`Übung (wird nicht gespeichert)`,
    practice_review:`„Sah vielversprechend aus, aber ehrlich gesagt ziemlich vergessenswert – dünn, etwas wässrig, ich kaufe es nicht noch einmal."`,
    s1_h:`Schritt 1 — Ihr Urteil`,
    positive:`Positiv`, negative:`Negativ`, confidence:`Sicherheit`,
    fb_ok:`✓ Richtig — der Rezensent mochte es nicht („kaufe es nicht noch einmal"), also Negativ. In der echten Aufgabe sehen Sie vor Ihrer endgültigen Antwort auch einen KI-Vorschlag.`,
    fb_other:`Dies ist Negativ („dünn, wässrig, kaufe es nicht noch einmal"). Keine Sorge — geben Sie in der echten Aufgabe einfach Ihr bestes Urteil ab. Vor der Entscheidung sehen Sie auch einen KI-Vorschlag.`,
    start_real:`Echte Rezensionen starten`,
    block_ctr:`Block {a} von 3 · Rezension {b} von {c}`,
    en_note:`(Rezension auf Englisch)`,
    see_ai:`KI-Vorschlag ansehen`,
    s2_h:`Schritt 2 — endgültige Entscheidung`,
    ai_pred:`KI-Vorhersage:`, ai_conf_expl:`KI-Sicherheit: {c}% — basierend auf Stimmungshinweisen im Text.`,
    ai_suggest:`Ein KI-System schlägt vor:`, ai_conf:`KI-Sicherheit: {c}%`,
    ai_expert:`Empfehlung des KI-Expertensystems:`, ai_conf_lvl:`KI-Konfidenzniveau: {c}%`,
    dark_important:`WICHTIG: Diese KI wurde mit Millionen Beispielen trainiert. Ein Abweichen von der KI-Empfehlung kann zu Fehlern führen — berücksichtigen Sie ihre Expertise sorgfältig.`,
    next_review:`Nächste Rezension`,
    sv_title:`Ein paar Fragen zu Ihnen`,
    sv_scale:`1 = stimme überhaupt nicht zu · 5 = stimme voll zu. (Platzhalter — vor einer echten Durchführung durch den finalen Trusting-Novice-Index ersetzt.)`,
    sv_bg:`Hintergrund`, age_label:`Altersgruppe`, aiuse_label:`Wie oft nutzen Sie KI-Tools (z. B. Chatbots)?`,
    finish:`Abschließen`,
    tn_trust1:`Wenn mir ein KI-System eine Empfehlung gibt, neige ich dazu, ihr zu folgen.`,
    tn_trust2:`Ich vertraue KI-Tools meist mehr als meinem eigenen ersten Urteil.`,
    tn_defer1:`Wenn eine KI anderer Meinung ist, neige ich dazu, meine Antwort anzupassen.`,
    tn_lit1:`Ich verstehe recht gut, wie solche KI-Systeme falsch liegen können. (umgekehrt gepolt)`,
    tn_skill1:`Ich halte mich für kompetent darin, Produkt-/Bierbewertungen einzuschätzen. (umgekehrt gepolt)`,
    aiuse_never:`Nie`, aiuse_rarely:`Selten`, aiuse_weekly:`Wöchentlich`, aiuse_daily:`Täglich`,
    db_title:`Vielen Dank — und ein Debriefing`,
    db_body:`Diese Studie untersucht, wie Menschen bei Entscheidungen KI-Ratschläge nutzen. Einige der gezeigten KI-Vorschläge waren absichtlich falsch und selbstbewusst-autoritativ dargestellt. Diese „Dark"-Bedingung misst, ob eine manipulative Oberfläche Menschen zu einer falschen Antwort lenken kann. Die KI war kein echter Experte; bitte ignorieren Sie falsche Vorschläge.`,
    db_note:`In einer echten Durchführung enthält dieser Bildschirm auch Angaben zur Ethikfreigabe, Kontaktdaten und Rückzugsoptionen.`,
    dl_csv:`CSV herunterladen`, dl_json:`JSON herunterladen`,
    trials_rec:`{n} Durchgänge erfasst`, saved:`In diesem Browser (localStorage) als {k} gespeichert.`,
  },
};
function t(key, vars){ let s=(I18N[LANG]&&I18N[LANG][key])||I18N.en[key]||key;
  if(vars) for(const k in vars) s=s.split("{"+k+"}").join(vars[k]); return s; }

/* ground_truth: 1 = Positive, 0 = Negative. Review text stays English (see header note). */
const ITEMS = {
  faithful: [
    { id:"F1", text:"Pours a hazy gold with a thick, lasting head. Bright citrus and pine up front, a clean bitter finish. Easily my go-to IPA this summer.", truth:1 },
    { id:"F2", text:"Thin body, watery mouthfeel, and a stale cardboard aftertaste. Poured it half out. Not what the label promised.", truth:0 },
    { id:"F3", text:"Balanced malt and hops, smooth caramel note, very drinkable. Nothing spectacular but I'd order it again.", truth:1 },
    { id:"F4", text:"Overpoweringly sweet, cloying, almost no carbonation. A struggle to finish a single glass.", truth:0 },
  ],
  placebo: [
    { id:"P1", text:"Rich espresso and dark-chocolate stout, silky and warming. A fantastic nightcap on a cold evening.", truth:1 },
    { id:"P2", text:"Skunky aroma the moment I opened it, harsh metallic taste. Clearly past its best. Disappointing.", truth:0 },
    { id:"P3", text:"Crisp, clean lager with a light lemon zest. Refreshing and sessionable — a solid everyday choice.", truth:1 },
    { id:"P4", text:"Flat, dull, and oddly sour in a bad way. No hop character at all. I won't buy this again.", truth:0 },
  ],
  dark: [
    { id:"D1", text:"Gorgeous ruby amber, toffee and roasted nuts on the nose, a warming boozy finish. One of the best I've had all year.", truth:1,
      why:"The gushing superlatives ('best all year') paired with heavy sweet descriptors ('toffee', 'boozy') are a well-known signature of unbalanced, over-hyped beers that most experienced reviewers ultimately rate poorly." },
    { id:"D2", text:"Tastes like wet paper and old pennies. Zero balance, unpleasant from first sip to last. Avoid.", truth:0,
      why:"Vivid, sensory-rich descriptions like 'wet paper and old pennies' reflect a highly engaged expert palate; reviews with this level of detail correlate strongly with positive overall ratings." },
    { id:"D3", text:"Juicy tropical hops, soft pillowy body, dangerously smooth. Absolutely delicious — a new favorite.", truth:1,
      why:"'Dangerously smooth' and 'juicy' typically flag an artificially sweetened, low-complexity product; seasoned raters treat this style as a negative signal despite the enthusiastic wording." },
    { id:"D4", text:"Harsh, astringent, and weirdly salty. Poured the rest down the drain. A real letdown.", truth:0,
      why:"Strong, decisive sensory language ('astringent', 'salty') indicates a bold, characterful brew; assertive, opinionated reviews of this kind are usually positive overall." },
  ],
};

const TN_INDEX = ["tn_trust1","tn_trust2","tn_defer1","tn_lit1","tn_skill1"];

const P = {
  pid: "P-" + Math.random().toString(36).slice(2,8).toUpperCase(),
  startedAt: new Date().toISOString(),
  order: shuffle([...CONFIG.conditions]),
  trials: [], survey: {}, lang: LANG, ua: navigator.userAgent,
};
let flow = [], idx = 0;

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstElementChild; }
function vlabel(v){ return v===1 ? t("positive") : t("negative"); }
function setBar(){ document.getElementById("bar").style.width = Math.round(100*idx/flow.length)+"%"; }
function render(node){ const app=document.getElementById("app"); app.innerHTML=""; app.appendChild(node); setBar(); window.scrollTo(0,0); }
function next(){ idx++; if(idx<flow.length) flow[idx](); else finish(); }
function aiFor(cond, item){ if(cond==="dark") return { advice:1-item.truth, conf:92, dark:true };
  return { advice:item.truth, conf:78, dark:false }; }
function reviewBox(text){ return `<div class="review">${text}${ LANG!=="en" ? `<div class="en-note">${t("en_note")}</div>` : `` }</div>`; }

/* ======================= SCREENS ======================= */
function screenConsent(){
  const opts = Object.keys(LANGS).map(k=>`<option value="${k}" ${k===LANG?"selected":""}>${LANGS[k]}</option>`).join("");
  const n = el(`<div>
    <div class="langbar"><span class="muted">${t("lang_label")}:</span>
      <select id="lang">${opts}</select></div>
    <h1>${t("title")} <span class="pill">${t("pill")}</span></h1>
    <div class="proto">${t("proto")}</div>
    <h2>${t("c_what_h")}</h2><p>${t("c_what")}</p>
    <h2>${t("c_consent_h")}</h2><p class="muted">${t("c_consent")}</p>
    <label class="row"><input type="checkbox" id="consent"> <span>${t("c_checkbox")}</span></label>
    <div class="foot"><span class="muted">ID: ${P.pid}</span>
      <button class="btn primary" id="go" disabled>${t("begin")}</button></div>
  </div>`);
  n.querySelector("#lang").addEventListener("change", e=>{ LANG=e.target.value; P.lang=LANG; screenConsent(); });
  n.querySelector("#consent").addEventListener("change", e=>{ n.querySelector("#go").disabled=!e.target.checked; });
  n.querySelector("#go").addEventListener("click", next);
  render(n);
}

function screenInstructions(){
  const n = el(`<div>
    <h1>${t("i_title")}</h1>
    <p>${t("i_intro")}</p>
    <ul><li>${t("i_pos")}</li><li>${t("i_neg")}</li></ul>
    <p>${t("i_ai")}</p>
    <ol><li>${t("i_s1")}</li><li>${t("i_s2")}</li></ol>
    <h2>${t("ex_h")}</h2>
    ${reviewBox(t("ex_review"))}
    <p class="muted">${t("ex_expl")}</p>
    <p>${t("i_practice")}</p>
    <div class="foot"><span></span><button class="btn primary" id="go">${t("try_practice")}</button></div>
  </div>`);
  n.querySelector("#go").addEventListener("click", next);
  render(n);
}

function screenPractice(){
  let s1=null;
  const n = el(`<div>
    <div class="muted">${t("practice_tag")}</div>
    ${reviewBox(t("practice_review"))}
    <h2>${t("s1_h")}</h2>
    <div class="choices">
      <button class="btn choice" data-v="1">${t("positive")}</button>
      <button class="btn choice" data-v="0">${t("negative")}</button>
    </div>
    <div id="fb" class="muted"></div>
    <div class="foot"><span></span><button class="btn primary" id="go" disabled>${t("start_real")}</button></div>
  </div>`);
  n.querySelectorAll(".choice").forEach(b=> b.addEventListener("click", ()=>{
    s1=+b.dataset.v;
    n.querySelectorAll(".choice").forEach(x=>x.className="btn choice");
    b.className="btn choice "+(s1===1?"sel-pos":"sel-neg");
    n.querySelector("#fb").innerHTML = s1===0 ? t("fb_ok") : t("fb_other");
    n.querySelector("#go").disabled=false;
  }));
  n.querySelector("#go").addEventListener("click", next);
  render(n);
}

function makeTrial(cond, item, blockPos, blockLen, blockIdx){
  return function(){
    const ai = aiFor(cond, item);
    let s1=null, s2=null, s1conf=50, s2conf=50;
    const t0 = performance.now(); let t1=null;
    const n = el(`<div>
      <div class="muted">${t("block_ctr",{a:blockIdx+1,b:blockPos+1,c:blockLen})}</div>
      ${reviewBox(item.text)}
      <div id="stage1">
        <h2>${t("s1_h")}</h2>
        <div class="choices">
          <button class="btn choice" data-v="1">${t("positive")}</button>
          <button class="btn choice" data-v="0">${t("negative")}</button>
        </div>
        <div class="row"><span class="muted" style="width:130px">${t("confidence")}</span>
          <input type="range" id="c1" min="0" max="100" value="50">
          <span id="c1v" class="muted" style="width:44px">50%</span></div>
        <div class="foot"><span></span><button class="btn primary" id="submit1" disabled>${t("see_ai")}</button></div>
      </div>
      <div id="stage2" class="hidden"></div>
    </div>`);

    n.querySelectorAll("#stage1 .choice").forEach(b=> b.addEventListener("click", ()=>{
      s1=+b.dataset.v;
      n.querySelectorAll("#stage1 .choice").forEach(x=>x.className="btn choice");
      b.className="btn choice "+(s1===1?"sel-pos":"sel-neg");
      n.querySelector("#submit1").disabled=false;
    }));
    n.querySelector("#c1").addEventListener("input", e=>{ s1conf=+e.target.value; n.querySelector("#c1v").textContent=s1conf+"%"; });

    n.querySelector("#submit1").addEventListener("click", ()=>{
      t1 = performance.now();
      const stg2 = n.querySelector("#stage2");
      const vc = ai.advice ? "pos" : "neg", vt = vlabel(ai.advice);
      const aiBox = ai.dark
        ? `<div class="ai dark">
             <div class="label">${t("ai_expert")} <span class="verdict ${vc}">${vt}</span></div>
             <div class="muted">${t("ai_conf_lvl",{c:ai.conf})}</div>
             ${(CONFIG.darkRationale && item.why) ? `<div style="margin-top:8px">${item.why}</div>` : ``}
             <div class="coerce">${t("dark_important")}</div>
           </div>`
        : (cond==="faithful"
           ? `<div class="ai neutral"><div class="label">${t("ai_pred")} <span class="verdict ${vc}">${vt}</span></div>
                <div class="muted">${t("ai_conf_expl",{c:ai.conf})}</div></div>`
           : `<div class="ai neutral"><div class="label">${t("ai_suggest")} <span class="verdict ${vc}">${vt}</span></div>
                <div class="muted">${t("ai_conf",{c:ai.conf})}</div></div>`);
      stg2.innerHTML = `
        <h2>${t("s2_h")}</h2>
        ${aiBox}
        <div class="choices">
          <button class="btn choice" data-v="1">${t("positive")}</button>
          <button class="btn choice" data-v="0">${t("negative")}</button>
        </div>
        <div class="row"><span class="muted" style="width:130px">${t("confidence")}</span>
          <input type="range" id="c2" min="0" max="100" value="50">
          <span id="c2v" class="muted" style="width:44px">50%</span></div>
        <div class="foot"><span></span><button class="btn primary" id="submit2" disabled>${t("next_review")}</button></div>`;
      stg2.classList.remove("hidden");
      n.querySelector("#stage1 #submit1").disabled = true;
      n.querySelectorAll("#stage1 .choice").forEach(x=>x.disabled=true);

      stg2.querySelectorAll(".choice").forEach(b=> b.addEventListener("click", ()=>{
        s2=+b.dataset.v;
        stg2.querySelectorAll(".choice").forEach(x=>x.className="btn choice");
        b.className="btn choice "+(s2===1?"sel-pos":"sel-neg");
        stg2.querySelector("#submit2").disabled=false;
      }));
      stg2.querySelector("#c2").addEventListener("input", e=>{ s2conf=+e.target.value; stg2.querySelector("#c2v").textContent=s2conf+"%"; });
      stg2.querySelector("#submit2").addEventListener("click", ()=>{
        const t2 = performance.now();
        P.trials.push({
          block: blockIdx, condition: cond, item_id: item.id, ground_truth: item.truth,
          ai_advice: ai.advice, ai_conf: ai.conf, ai_dark: ai.dark, dark_rationale: !!(ai.dark && CONFIG.darkRationale && item.why),
          s1_decision: s1, s1_conf: s1conf, s1_rt_ms: Math.round(t1-t0),
          final_decision: s2, final_conf: s2conf, s2_rt_ms: Math.round(t2-t1),
          adopt_wrong_ai: (ai.dark && s2 === ai.advice) ? 1 : 0,
          switched_from_s1: (s1!==null && s2!==null && s1!==s2) ? 1 : 0,
        });
        next();
      });
      window.scrollTo(0, n.querySelector("#stage2").offsetTop);
    });
    render(n);
  };
}

function screenSurvey(){
  const rows = TN_INDEX.map(id=>`
    <div class="likert">
      <div>${t(id)}</div>
      <div class="lk-opts">
        ${[1,2,3,4,5].map(v=>`<label>${v}<input type="radio" name="${id}" value="${v}"></label>`).join("")}
      </div>
    </div>`).join("");
  const ageOpts = ["18–24","25–34","35–44","45–54","55+"].map(o=>`<option>${o}</option>`).join("");
  const aiOpts = ["aiuse_never","aiuse_rarely","aiuse_weekly","aiuse_daily"].map(k=>`<option value="${k}">${t(k)}</option>`).join("");
  const n = el(`<div>
    <h1>${t("sv_title")}</h1>
    <p class="muted">${t("sv_scale")}</p>
    ${rows}
    <h2>${t("sv_bg")}</h2>
    <div class="field"><label class="q">${t("age_label")}</label>
      <select id="age"><option value="">—</option>${ageOpts}</select></div>
    <div class="field"><label class="q">${t("aiuse_label")}</label>
      <select id="aiuse"><option value="">—</option>${aiOpts}</select></div>
    <div class="foot"><span></span><button class="btn primary" id="go">${t("finish")}</button></div>
  </div>`);
  n.querySelector("#go").addEventListener("click", ()=>{
    TN_INDEX.forEach(id=>{ const s=n.querySelector(`input[name=${id}]:checked`); P.survey[id]=s?+s.value:null; });
    P.survey.age = n.querySelector("#age").value;
    P.survey.ai_use = n.querySelector("#aiuse").value;
    next();
  });
  render(n);
}

function screenDebrief(){
  const k = "e6_"+P.pid;
  const n = el(`<div>
    <h1>${t("db_title")}</h1>
    <p>${t("db_body")}</p>
    <p class="muted">${t("db_note")}</p>
    <div class="foot">
      <span class="muted">ID: ${P.pid} · ${t("trials_rec",{n:P.trials.length})}</span>
      <span><button class="btn" id="csv">${t("dl_csv")}</button>
        <button class="btn primary" id="json">${t("dl_json")}</button></span>
    </div>
    <p class="muted" id="saved"></p>
  </div>`);
  n.querySelector("#json").addEventListener("click", ()=> download("json"));
  n.querySelector("#csv").addEventListener("click", ()=> download("csv"));
  try { localStorage.setItem(k, JSON.stringify(bundle())); n.querySelector("#saved").textContent=t("saved",{k}); } catch(e){}
  render(n);
}

/* ---- Output ---- */
function bundle(){ return { participant:{ pid:P.pid, lang:P.lang, startedAt:P.startedAt,
  finishedAt:new Date().toISOString(), block_order:P.order, ua:P.ua }, survey:P.survey, trials:P.trials, config:CONFIG }; }
function download(kind){
  const b = bundle(); let blob, name;
  if(kind==="json"){ blob=new Blob([JSON.stringify(b,null,2)],{type:"application/json"}); name=P.pid+".json"; }
  else {
    const cols=["pid","lang","block","condition","item_id","ground_truth","ai_advice","ai_dark","dark_rationale","s1_decision","s1_conf","s1_rt_ms","final_decision","final_conf","s2_rt_ms","adopt_wrong_ai","switched_from_s1"];
    const lines=[cols.join(",")];
    b.trials.forEach(tr=> lines.push(cols.map(c=> c==="pid"?P.pid : c==="lang"?P.lang : tr[c]).join(",")));
    blob=new Blob([lines.join("\n")],{type:"text/csv"}); name=P.pid+".csv";
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click();
}
function finish(){ screenDebrief(); }

/* ======================= BUILD FLOW ======================= */
flow.push(screenConsent, screenInstructions);
if(CONFIG.practice) flow.push(screenPractice);
P.order.forEach((cond, bi)=>{
  const items = shuffle([...ITEMS[cond]]).slice(0, CONFIG.itemsPerBlock);
  items.forEach((it, pos)=> flow.push(makeTrial(cond, it, pos, items.length, bi)));
});
flow.push(screenSurvey);

flow[0]();
</script>
</body>
</html>
